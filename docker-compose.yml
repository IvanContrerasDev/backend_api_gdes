services:
  postgres:
    image: postgres:16-alpine
    container_name: gdes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdes
      POSTGRES_PASSWORD: gdes
      POSTGRES_DB: gdes
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gdes -d gdes']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # Apache-2.0; pinned release and manifest digest, verified against upstream 4.52.
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    restart: unless-stopped
    command:
      [
        mini,
        '-dir=/data',
        '-ip=storage',
        '-ip.bind=0.0.0.0',
        '-s3.port=8333',
        '-master.volumeSizeLimitMB=128',
        '-volume.max=4',
        '-master.telemetry=false',
        '-webdav=false',
        '-admin.ui=false',
        '-s3.port.iceberg=0',
        '-s3.port.lance=0',
      ]
    environment:
      AWS_ACCESS_KEY_ID: dev-storage-access
      AWS_SECRET_ACCESS_KEY: dev-storage-secret-change-me
      S3_BUCKET: gdes-dev
    ports:
      - '${STORAGE_PORT:-8333}:8333'
    volumes:
      - storage_data:/data

  api:
    build:
      context: .
      target: build
    container_name: gdes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    command: sh -c "node scripts/storage-ready.cjs && npx prisma migrate deploy && node dist/main.js"
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://gdes:gdes@postgres:5432/gdes
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      # External services are mocked in dev (log providers); keys are placeholders.
      EMAIL_PROVIDER: log
      WHATSAPP_PROVIDER: log
      RESEND_API_KEY: dev-placeholder
      EMAIL_FROM: no-reply@gdes.local
      WHATSAPP_TOKEN: dev-placeholder
      WHATSAPP_PHONE_NUMBER_ID: dev-placeholder
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}
      STORAGE_ALLOW_INSECURE_HTTP: 'true'
      STORAGE_BUCKET: gdes-dev
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: dev-storage-access
      STORAGE_SECRET_ACCESS_KEY: dev-storage-secret-change-me
      GOOGLE_CLIENT_ID: dev-placeholder
      GEOFENCE_TOLERANCE_METERS: '100'
      OTP_TTL_MINUTES: '10'
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:5173}
      MOBILE_DEEP_LINK_SCHEME: gdes
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

volumes:
  postgres_data:
  storage_data:
